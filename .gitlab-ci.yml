stages:
  - test
  - build

default:
  interruptible: true

# Runs on any Linux/Docker runner (fast, no platform-specific tooling).
# `scripts/verify.mjs` runs the test suite and writes docs/automated-test-results.tap.
test:
  stage: test
  image: node:22
  tags:
    - linux
  script:
    - node --version
    - node scripts/verify.mjs
  artifacts:
    paths:
      - docs/automated-test-results.tap
    expire_in: 2 weeks
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Produces the Windows launcher executable + embedded web archive.
# Runner requirements: Windows, Node.js 22, .NET Framework 4.8 (csc.exe ships
# with Windows Server). See docs/CI.md for runner registration.
build:windows:
  stage: build
  tags:
    - windows
  script:
    - npm run build
    - powershell -NoProfile -ExecutionPolicy Bypass -File desktop/build.ps1
  artifacts:
    name: "windows-$CI_COMMIT_REF_NAME"
    paths:
      - desktop/release/AETOS-Office-Assistant-*.exe
      - desktop/release/aetos-web.zip
    expire_in: 2 weeks
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# Produces the macOS .app bundle + distributable zip.
# Runner requirements: macOS, Xcode command line tools (swiftc/lipo/iconutil),
# Node.js 22. See docs/CI.md for runner registration.
build:macos:
  stage: build
  tags:
    - macos
  script:
    - ./macos/build.sh
    - '"macos/build/AETOS Office Assistant.app/Contents/MacOS/AETOS-Office-Assistant" --self-test-routes "$CI_PROJECT_DIR/macos/self-test-routes.txt"'
    - cat macos/self-test-routes.txt
  artifacts:
    name: "macos-$CI_COMMIT_REF_NAME"
    paths:
      - macos/build/AETOS-Office-Assistant-*-macos.zip
      - "macos/build/AETOS Office Assistant.app"
      - macos/self-test-routes.txt
    expire_in: 2 weeks
  rules:
    - if: $CI_COMMIT_TAG
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
